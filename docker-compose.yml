version: '3.8'

services:
  voltiq-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voltiq-platform
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - JWT_SECRET=voltiq-production-secret-key-2026-btech
      - CLIENT_ORIGIN=http://localhost:5173
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
